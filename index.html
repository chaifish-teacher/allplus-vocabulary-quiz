border-radius:8px;background:#edf3fb;min-width:30px;padding:2px 8px;text-align:center;font-weight:800}.choice.active{border-color:#428bd2;background:#f0f7ff}.choice:focus-visible,.btn:focus-visible,.number:focus-visible{outline:3px solid orange;outline-offset:2px}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}.side h3{margin:0 0 10px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.number{border:1px solid #ccdbec;border-radius:8px;background:white;padding:7px 0;cursor:pointer;font-size:14px}.number.done{background:#d7f3e7;border-color:#9acfb6}.number.current{outline:2px solid var(--blue)}.stat{font-weight:750;font-variant-numeric:tabular-nums}.footerhint{font-size:13px;color:#667c93;margin-top:12px}.score{text-align:center;padding:26px 0}.score .big{font-size:66px;color:var(--blue);font-weight:800;line-height:1.1}.review{border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0;background:#fff}.review.ok{border-left:6px solid #25946a}.review.bad{border-left:6px solid #d66060}.answerline{padding:10px 13px;border-radius:8px;background:#eff6fc;margin:8px 0}.explain{background:#fbfaf4;padding:14px;border-radius:10px;margin-top:12px;color:#45516a}.review .question{margin:9px 0 13px;font-size:18px}.review ul{margin:6px 0;padding-left:25px}.review li{padding:2px 0}.notice{background:#fff3d8;color:#784c0c;padding:10px 14px;border-radius:10px;margin-top:16px}#reviewList{margin-top:24px}details{margin-top:10px}summary{cursor:pointer;font-weight:700}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{order:-1}.panel{padding:18px}.hero{padding:35px 16px}.numbers{grid-template-columns:repeat(10,1fr)}.question{margin:15px 0}.choice{padding:12px}.score .big{font-size:52px}}

<section id="home" class="panel hero"><span class="pill">題庫 230 題・115 組不同單字與片語</span><h1>十月單字大挑戰</h1><p>25 題隨機抽題，同一回合單字不重複。<br>全部作答後，才公布成績、正確答案與詳解。</p><p class="small">四選一・每題 4 分・滿分 100 分・可重複挑戰</p><button class="btn" id="start">開始挑戰</button></section>

</main><script>const BANK=[{"id": 1, "date": "10/19", "article": "Learning to Let Go", "term": "disorder", "stem": "Doctors were concerned that her inability to discard even broken items might be a sign of a psychological _____.", "choices": ["detection", "disorder", "accessibility", "construction"], "answer": "B", "pos": "n.", "meaning": "（身心機能的）失調、疾病；混亂、失序", "clue": "失去丟棄物品的能力、psychological 都指向身心方面的「失調」"}, {"id": 2, "date": "10/19", "article": "Learning to Let Go", "term": "disorder", "stem": "The specialist explained that this sleep _____ could affect both concentration and memory.", "choices": ["submission", "antique", "disorder", "slot"], "answer": "C", "pos": "n.", "meaning": "（身心機能的）失調、疾病；混亂、失序", "clue": "sleep 與 concentration、memory 顯示是在談睡眠方面的障礙"}, {"id": 3, "date": "10/19", "article": "Learning to Let Go", "term": "distinguish", "stem": "It can be difficult to _____ genuine concern from simple curiosity in online comments.", "choices": ["distinguish", "default", "soar", "estimate"], "answer": "A", "pos": "v.", "meaning": "區分、辨別", "clue": "from A 與 B 的結構要求表示「區分」的動詞"}, {"id": 4, "date": "10/19", "article": "Learning to Let Go", "term": "distinguish", "stem": "The training helps students _____ reliable sources from misleading advertisements.", "choices": ["construct", "plunge", "hoard", "distinguish"], "answer": "D", "pos": "v.", "meaning": "區分、辨別", "clue": "reliable sources 與 misleading advertisements 是兩種需要「辨別」的對象"}, {"id": 5, "date": "10/19", "article": "Learning to Let Go", "term": "collector", "stem": "The art _____ searched for rare paintings at auctions around the world.", "choices": ["marathon", "pulley", "collector", "transportation"], "answer": "C", "pos": "n.", "meaning": "收藏家；收集者", "clue": "art 與 rare paintings 暗示收藏藝術品的人"}, {"id": 6, "date": "10/19", "article": "Learning to Let Go", "term": "collector", "stem": "As a passionate stamp _____, she carefully preserved every item in a special album.", "choices": ["antique", "marathon", "collector", "construction"], "answer": "C", "pos": "n.", "meaning": "收藏家；收集者", "clue": "stamp 與 special album 指的是收藏郵票的人"}, {"id": 7, "date": "10/19", "article": "Learning to Let Go", "term": "collection", "stem": "The museum's _____ includes objects that reveal how ordinary people lived centuries ago.", "choices": ["illusion", "collection", "possession", "submission"], "answer": "B", "pos": "n.", "meaning": "收藏品；收藏（行為）；收集物（第9 行）", "clue": "museum 與 objects 表示一批展品或收藏品"}, {"id": 8, "date": "10/19", "article": "Learning to Let Go", "term": "collection", "stem": "His _____ of postcards documents places that no longer exist.", "choices": ["preference", "collection", "beverage", "portfolio"], "answer": "B", "pos": "n.", "meaning": "收藏品；收藏（行為）；收集物（第9 行）", "clue": "postcards of places 表示成套收集的明信片"}, {"id": 9, "date": "10/19", "article": "Learning to Let Go", "term": "antique", "stem": "Although the clock was a valuable _____, its owner still used it every day.", "choices": ["fatigue", "endurance", "species", "antique"], "answer": "D", "pos": "n.", "meaning": "古董；古物", "clue": "valuable clock 與歷史物品語境指古董"}, {"id": 10, "date": "10/19", "article": "Learning to Let Go", "term": "antique", "stem": "Experts examined the wooden chair to determine whether it was a genuine _____ or a modern copy.", "choices": ["application", "antique", "invention", "accessibility"], "answer": "B", "pos": "n.", "meaning": "古董；古物", "clue": "genuine 與 modern copy 形成真古董、仿製品的對比"}, {"id": 11, "date": "10/19", "article": "Learning to Let Go", "term": "possession", "stem": "She considered the letters her most precious _____ because they reminded her of her grandmother.", "choices": ["adaptation", "stationery", "slot", "possession"], "answer": "D", "pos": "n.", "meaning": "個人物品、財物（可數）；擁有、占有（不可數）", "clue": "most precious 與 letters 顯示她珍視的一件私人財物"}, {"id": 12, "date": "10/19", "article": "Learning to Let Go", "term": "possession", "stem": "One personal _____ was damaged during the unexpected flood.", "choices": ["slot", "therapy", "possession", "authorship"], "answer": "C", "pos": "n.", "meaning": "個人物品、財物（可數）；擁有、占有（不可數）", "clue": "one personal 後需要可數單數名詞，表示私人物品"}, {"id": 13, "date": "10/19", "article": "Learning to Let Go", "term": "therapy", "stem": "After the accident, regular physical _____ helped the athlete regain strength.", "choices": ["therapy", "distraction", "antique", "collector"], "answer": "A", "pos": "n.", "meaning": "治療；療法", "clue": "physical 與 regain strength 指的是復健治療"}, {"id": 14, "date": "10/19", "article": "Learning to Let Go", "term": "therapy", "stem": "The counselor recommended _____ to help him manage his anxiety rather than ignore it.", "choices": ["therapy", "disorder", "invention", "clutter"], "answer": "A", "pos": "n.", "meaning": "治療；療法", "clue": "counselor 與 manage anxiety 顯示談的是心理治療"}, {"id": 15, "date": "10/19", "article": "Learning to Let Go", "term": "hoard", "stem": "Some shoppers began to _____ bottled water even though officials said supplies were sufficient.", "choices": ["mash", "brainstorm", "disclose", "hoard"], "answer": "D", "pos": "v.", "meaning": "囤積、大量儲藏（hoarding disorder指「囤積症」）", "clue": "bottled water 與 supplies sufficient 對比，表示不必要地囤積"}, {"id": 16, "date": "10/19", "article": "Learning to Let Go", "term": "hoard", "stem": "Rather than _____ old newspapers, he decided to recycle most of them.", "choices": ["deep-fry", "soar", "hoard", "estimate"], "answer": "C", "pos": "v.", "meaning": "囤積、大量儲藏（hoarding disorder指「囤積症」）", "clue": "購物者在不缺貨時大量儲存用品，語意是囤積"}, {"id": 17, "date": "10/19", "article": "Learning to Let Go", "term": "hoarder", "stem": "The documentary follows a _____ who struggles to throw away even useless objects.", "choices": ["disorder", "lifespan", "beverage", "hoarder"], "answer": "D", "pos": "n.", "meaning": "囤積者（第10 行）", "clue": "struggles to throw away 直接描述無法丟棄物品的人"}, {"id": 18, "date": "10/19", "article": "Learning to Let Go", "term": "hoarder", "stem": "With professional support, the _____ gradually learned to make space in her home.", "choices": ["invention", "architect", "hoarder", "packet"], "answer": "C", "pos": "n.", "meaning": "囤積者（第10 行）", "clue": "保留無用物品的行為，對應囤積者"}, {"id": 19, "date": "10/19", "article": "Learning to Let Go", "term": "stationery", "stem": "The new school shop sells notebooks, pens, and other _____.", "choices": ["caffeine", "possession", "submission", "stationery"], "answer": "D", "pos": "n.", "meaning": "文具", "clue": "notebooks、pens 是文具用品的例子"}, {"id": 20, "date": "10/19", "article": "Learning to Let Go", "term": "stationery", "stem": "Students were asked to bring their own _____ for the writing examination.", "choices": ["distraction", "trait", "preference", "stationery"], "answer": "D", "pos": "n.", "meaning": "文具", "clue": "學校商店出售筆記本和筆等物品，應用集合名詞文具"}, {"id": 21, "date": "10/19", "article": "Learning to Let Go", "term": "packet", "stem": "A small _____ of seeds came with instructions for growing vegetables at home.", "choices": ["evolution", "clutter", "architect", "packet"], "answer": "D", "pos": "n.", "meaning": "小包、小袋；小包裹", "clue": "small 與 of seeds 指一小包種子"}, {"id": 22, "date": "10/19", "article": "Learning to Let Go", "term": "packet", "stem": "She kept a _____ of tissues in her backpack in case someone needed one.", "choices": ["workout", "packet", "telescope", "hoarder"], "answer": "B", "pos": "n.", "meaning": "小包、小袋；小包裹", "clue": "種子與附帶種植指示的物品是一包小包裝"}, {"id": 23, "date": "10/19", "article": "Learning to Let Go", "term": "clutter", "stem": "The designer removed unnecessary _____ so that the small apartment would feel more spacious.", "choices": ["applicant", "clutter", "illusion", "hoarder"], "answer": "B", "pos": "n.", "meaning": "雜亂；雜亂的物品 v. 使雜亂、堆滿雜物", "clue": "unnecessary 與 apartment spacious 表示清理雜物"}, {"id": 24, "date": "10/19", "article": "Learning to Let Go", "term": "clutter", "stem": "Too much digital _____ on a screen can make important information difficult to find.", "choices": ["clutter", "consequence", "therapy", "trait"], "answer": "A", "pos": "n.", "meaning": "雜亂；雜亂的物品 v. 使雜亂、堆滿雜物", "clue": "去除多餘物件，讓空間不凌亂"}, {"id": 25, "date": "10/19", "article": "Learning to Let Go", "term": "let go", "stem": "Although the project had failed, he found it difficult to _____ of the idea he had worked on for years.", "choices": ["wear off", "let go", "hold the record for", "appeal to sb"], "answer": "B", "pos": "phr.", "meaning": "放開；放下、拋開", "clue": "let go of the idea 是「放下某想法」的固定搭配"}, {"id": 26, "date": "10/19", "article": "Learning to Let Go", "term": "let go", "stem": "The therapist encouraged her to _____ of regrets she could no longer change.", "choices": ["let go", "catch on", "hold the record for", "come into one's own"], "answer": "A", "pos": "phr.", "meaning": "放開；放下、拋開", "clue": "一個人難放下長期投入的計畫，應用 let go of"}, {"id": 27, "date": "10/19", "article": "Learning to Let Go", "term": "pile up", "stem": "Without a clear schedule, unfinished assignments can quickly _____.", "choices": ["wear off", "end up", "pile up", "pave the way for"], "answer": "C", "pos": "phr.", "meaning": "堆積；累積", "clue": "unfinished assignments 與 quickly 指作業堆積"}, {"id": 28, "date": "10/19", "article": "Learning to Let Go", "term": "pile up", "stem": "After several days of heavy rain, fallen branches began to _____ along the road.", "choices": ["let go", "pile up", "catch on", "stand out"], "answer": "B", "pos": "phr.", "meaning": "堆積；累積", "clue": "沒有排程使待辦工作愈積愈多"}, {"id": 29, "date": "10/20", "article": "The Hidden Costs of Energy Drinks", "term": "beverage", "stem": "The café offers a free hot _____ to customers who bring their own cups.", "choices": ["slot", "beverage", "consequence", "preference"], "answer": "B", "pos": "n.", "meaning": "飲料", "clue": "café、hot、cups 是飲料情境"}, {"id": 30, "date": "10/20", "article": "The Hidden Costs of Energy Drinks", "term": "beverage", "stem": "Nutrition labels reveal how much sugar a bottled _____ contains.", "choices": ["beverage", "counselor", "ingredient", "pulley"], "answer": "A", "pos": "n.", "meaning": "飲料", "c function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clean(s){return String(s??'')};function esc(s){return clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(){let map=new Map();BANK.forEach(q=>{if(!map.has(q.term))map.set(q.term,[]);map.get(q.term).push(q)});let terms=shuffle([...map.keys()]).slice(0,25);selected=terms.map(t=>{let q=shuffle(map.get(t))[0];let opts=shuffle(q.choices.map((label,i)=>({label,original:letters[i]})));return {...q,opts,correct:opts.findIndex(x=>x.original===q.answer)}});responses=Array(25).fill(null);at=0;wrongOnly=false;$('home').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');$('unansweredNote').classList.add('hide');render();window.scrollTo({top:0,behavior:'instant'})}
function render(){const q=selected[at];$('qNumber').textContent=`第 ${at+1} 題 / 25`;$('qMeta').textContent=`${q.date} · ${q.article}`;$('stem').textContent=q.stem;$('choices').innerHTML=q.opts.map((o,i)=>`<button class="choice ${responses[at]===i?'active':''}" data-choice="${i}" aria-pressed="${responses[at]===i}"><span class="letter">${letters[i]}</span><span>${esc(o.label)}</span></button>`).join('');document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{responses[at]=Number(el.dataset.choice);render()});$('prev').disabled=at===0;$('next').disabled=at===24;$('countDone').textContent=`${responses.filter(x=>x!==null).length} / 25`;$('progress').style.width=`${responses.filter(x=>x!==null).length*4}%`;$('submit').disabled=responses.some(x=>x===null);$('numbers').innerHTML=responses.map((v,i)=>`<button class="number ${v!==null?'done':''} ${at===i?'current':''}" data-q="${i}" aria-label="第${i+1}題${v!==null?'已作答':'未作答'}">${i+1}</button>`).join('');document.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{at=Number(el.dataset.q);render()})}
$('prev').onclick=()=>{if(at>0){at--;render()}};$('next').onclick=()=>{if(at<24){at++;render()}};$('start').onclick=start;$('retry').onclick=start;
function getMeaning(word){let v=GLOSS[word.toLowerCase()];return v?`${v.pos ? v.pos+'｜':''}${v.meaning}`:'此為干擾選項，須與句意及詞性一起辨別'}
function explanation(q){const right=q.opts[q.correct].label;const full=q.stem.replace(/_{3,}/g,right);let grammar=q.pos.includes('phr')?'本題還需確認整個片語能否直接放進空格，注意前後介系詞與受詞。':q.pos.includes('v')?'注意動詞的時態、語態及與前後介系詞的搭配。':q.pos.includes('adj')?'形容詞通常修飾名詞，或放在連綴動詞之後。':q.pos.includes('n')?'名詞需配合單複數、冠詞及句中角色。':'確認該詞在句中的詞性及語意。';return {full,grammar}}

function renderResults(){let correct=selected.filter((q,i)=>responses[i]===q.correct).length;$('total').textContent=`${correct*4} / 100`;$('resultStats').textContent=`答對 ${correct} 題｜答錯 ${25-correct} 題｜正確率 ${correct*4}%`;$('quiz').classList.add('hide');$('result').classList.remove('hide');renderReviews();window.scrollTo({top:0,behavior:'instant'})}
function renderReviews(){
 const list=selected.map((q,i)=>({q,i,ok:responses[i]===q.correct})).filter(x=>!wrongOnly||!x.ok);
 $('toggleWrong').textContent=wrongOnly?'顯示全部題目':'只看答錯題';
 $('reviewList').innerHTML=list.length?list.map(({q,i,ok})=>{
  const a=responses[i],mine=`${letters[a]}. ${q.opts[a].label}`,right=`${letters[q.correct]}. ${q.opts[q.correct].label}`;
  const detail=explanation(q);
  const options=q.opts.map((o,j)=>`<div class="glossrow ${j===q.correct?'correctgloss':''}"><strong>${letters[j]}. ${esc(o.label)}</strong> <span>${esc(getMeaning(o.label))}</span>${j===q.correct?' <b>✓ 正解</b>':''}</div>`).join('');
  return `<article class="review ${ok?'ok':'bad'}"><div class="toprow"><strong>第 ${i+1} 題 <span style="color:${ok?'#16815b':'#b33f48'}">${ok?'✓ 答對':'✗ 答錯'}</span></strong><span class="small">${esc(q.date)} · ${esc(q.article)}</span></div><div class="question">${esc(q.stem)}</div><div class="answerline">你的答案：${esc(mine)}<div><strong>正確答案：${esc(right)}</strong></div></div>
  <div class="explain"><div class="explainhead">① 完整英文句子</div><p>${esc(detail.full)}</p><div class="explainhead">② 正解與中文詞義</div><p><strong>${esc(q.term)}</strong>（${esc(q.pos)}）：${esc(q.meaning)}</p><div class="explainhead">③ 題目語境與解題線索</div><p>${esc(q.clue)}。${esc(detail.grammar)}</p><div class="explainhead">④ 四個選項逐一解釋</div>${options}<p class="small">辨析技巧：先判斷空格所需詞性，再依上下文找出最適合的語意；其他選項即使本身是正確英文，也不一定符合本句。</p></div></article>`
 }).join(''):'<p>這回合全部答對！</p>';
}
$('toggleWrong').onclick=()=>{wrongOnly=!wrongOnly;renderReviews()};$('submit').onclick=()=>{if(responses.some(x=>x===null)){$('unansweredNote').textContent='請先完成所有題目。';$('unansweredNote').classList.remove('hide');return}if(confirm('確認交卷？交卷後即顯示分數與解析，無法再修改答案。'))renderResults()};
