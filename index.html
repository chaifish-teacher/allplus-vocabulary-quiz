<section id="home" class="panel hero"><span class="pill">題庫 230 題・115 組不同單字與片語</span><h1>十月單字大挑戰</h1><p>25 題隨機抽題，同一回合單字不重複。<br>全部作答後，才公布成績、正確答案與詳解。</p><p class="small">四選一・每題 4 分・滿分 100 分・可重複挑戰</p><button class="btn" id="start">開始挑戰</button></section>

ices": ["illusion", "collection", "possession", "submission"], "answer": "B", "pos": "n.", "meaning": "收藏品；收藏（行為）；收集物（第9 行）"}, {"id": 8, "date": "10/19", "article": "Learning to Let Go", "term": "collection", "stem": "His _____ of postcards documents places that no longer exist.", "choices": ["preference", "collection", "beverage", "portfolio"], "answer": "B", "pos": "n.", "meaning": "收藏品；收藏（行為）；收集物（第9 行）"}, {"id": 9, "date": "10/19", "article": "Learning to Let Go", "term": "antique", "stem": "Although the clock was a valuable _____, its owner still used it every day.", "choices": ["fatigue", "endurance", "species", "antique"], "answer": "D", "pos": "n.", "meaning": "古董；古物"}, {"id": 10, "date": "10/19", "article": "Learning to Let Go", "term": "antique", "stem": "Experts examined the wooden chair to determine whether it was a genuine _____ or a modern copy.", "choices": ["application", "antique", "invention", "accessibility"], "answer": "B", "pos": "n.", "meaning": "古董；古物"}, {"id": 11, "date": "10/19", "article": "Learning to Let Go", "term": "possession", "stem": "She considered the letters her most precious _____ because they reminded her of her grandmother.", "choices": ["adaptation", "stationery", "slot", "possession"], "answer": "D", "pos": "n.", "meaning": "個人物品、財物（可數）；擁有、占有（不可數）"}, {"id": 12, "date": "10/19", "article": "Learning to Let Go", "term": "possession", "stem": "One personal _____ was damaged during the unexpected flood.", "choices": ["slot", "therapy", "possession", "authorship"], "answer": "C", "pos": "n.", "meaning": "個人物品、財物（可數）；擁有、占有（不可數）"}, {"id": 13, "date": "10/19", "article": "Learning to Let Go", "term": "therapy", "stem": "After the accident, regular physical _____ helped the athlete regain strength.", "choices": ["therapy", "distraction", "antique", "collector"], "answer": "A", "pos": "n.", "meaning": "治療；療法"}, {"id": 14, "date": "10/19", "article": "Learning to Let Go", "term": "therapy", "stem": "The counselor recommended _____ to help him manage his anxiety rather than ignore it.", "choices": ["therapy", "disorder", "invention", "clutter"], "answer": "A", "pos": "n.", "meaning": "治療；療法"}, {"id": 15, "date": "10/19", "article": "Learning to Let Go", "term": "hoard", "stem": "Some shoppers began to _____ bottled water even though officials said supplies were sufficient.", "choices": ["mash", "brainstorm", "disclose", "hoard"], "answer": "D", "pos": "v.", "meaning": "囤積、大量儲藏（hoarding disorder指「囤積症」）"}, {"id": 16, "date": "10/19", "article": "Learning to Let Go", "term": "hoard", "stem": "Rather than _____ old newspapers, he decided to recycle most of them.", "choices": ["deep-fry", "soar", "hoard", "estimate"], "answer": "C", "pos": "v.", "meaning": "囤積、大量儲藏（hoarding disorder指「囤積症」）"}, {"id": 17, "date": "10/19", "article": "Learning to Let Go", "term": "hoarder", "stem": "The documentary follows a _____ who struggles to throw away even useless objects.", "choices": ["disorder", "lifespan", "beverage", "hoarder"], "answer": "D", "pos": "n.", "meaning": "囤積者（第10 行）"}, {"id": 18, "date": "10/19", "article": "Learning to Let Go", "term": "hoarder", "stem": "With professional support, the _____ gradually learned to make space in her home.", "choices": ["invention", "architect", "hoarder", "packet"], "answer": "C", "pos": "n.", "meaning": "囤積者（第10 行）"}, {"id": 19, "date": "10/19", "article": "Learning to Let Go", "term": "stationery", "stem": "The new school shop sells notebooks, pens, and other _____.", "choices": ["caffeine", "possession", "submission", "stationery"], "answer": "D", "pos": "n.", "meaning": "文具"}, {"id": 20, "date": "10/19", "article": "Learning to Let Go", "term": "stationery", "stem": "Students were asked to bring their own _____ for the writing examination.", "choices": ["distraction", "trait", "preference", "stationery"], "answer": "D", "pos": "n.", "meaning": "文具"}, {"id": 21, "date": "10/19", "article": "Learning to Let Go", "term": "packet", "stem": "A small _____ of seeds came t Go", "term": "pile up", "stem": "After several days of heavy rain, fallen branches began to _____ along the road.", "choices": ["let go", "pile up", "catch on", "stand out"], "answer": "B", "pos": "phr.", "meaning": "堆積；累積"}, {"id": 29, "date": "10/20", "article": "The Hidden Costs of Energy Drinks", "term": "beverage", "stem": "The café offers a free hot _____ to customers who bring their own cups.", "choices": ["slot", "beverage", "consequence", "preference"], "answer": "B", "pos": "n.", "meaning": "飲料"}, {"id": 30, "date": "10/20", "article": "The Hidden Costs of Energy Drinks", "term": "beverage", "stem": "Nutrition labels reveal how much sugar a bottled _____ contains.", "choices": ["beverage", "counselor", "ingredient", "pulley"], "answer": "A", "pos": "n.", "meaning": "飲料"}, {"id": 31, "date": "10/20", "article": "The Hidden Costs of Energy Drinks", "term": "fatigue", "stem": "Working late for several nights caused severe _____ and reduced her ability to focus.", "choices": ["fatigue", "authorship", "pulley", "collector"], "answer": "A", "pos": "n.", "meaning": "疲勞、疲倦"}, {"id": 32, "date": "10/20", "article": "The Hidden Costs of Energy Drinks", "term": "fatigue", "stem": "The researcher warned that mental _____ can be just as harmful as physical exhaustion.", "choices": ["lifespan", "portfolio", "adaptation", "fatigue"], "answer": "D", "pos": "n.", "meaning": "疲勞、疲倦"}, {"id": 33, "date": "10/20", "article": "The Hidden Costs of Energy Drinks", "term": "ingredient", "stem": "The chef refused to reveal the secret _____ that made the sauce taste unusual.", "choices": ["ingredient", "counselor", "authorship", "adaptation"], "answer": "A", "pos": "n.", "meaning": "成分、食材、原料；要素"}, {"id": 34, "date": "10/20", "article": "The Hidden Costs of Energy Drinks", "term": "ingredient", "stem": "Trust is an essential _____ in building strong relationships, not just in cooking.", "choices": ["stationery", "invention", "ingredient", "slot"], "answer": "C", "pos": "n.", "mean function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clean(s){return String(s??'')};function esc(s){return clean(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(){let map=new Map();BANK.forEach(q=>{if(!map.has(q.term))map.set(q.term,[]);map.get(q.term).push(q)});let terms=shuffle([...map.keys()]).slice(0,25);selected=terms.map(t=>{let q=shuffle(map.get(t))[0];let opts=shuffle(q.choices.map((label,i)=>({label,original:letters[i]})));return {...q,opts,correct:opts.findIndex(x=>x.original===q.answer)}});responses=Array(25).fill(null);at=0;wrongOnly=false;$('home').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');$('unansweredNote').classList.add('hide');render();window.scrollTo({top:0,behavior:'instant'})}
function render(){const q=selected[at];$('qNumber').textContent=`第 ${at+1} 題 / 25`;$('qMeta').textContent=`${q.date} · ${q.article}`;$('stem').textContent=q.stem;$('choices').innerHTML=q.opts.map((o,i)=>`<button class="choice ${responses[at]===i?'active':''}" data-choice="${i}" aria-pressed="${responses[at]===i}"><span class="letter">${letters[i]}</span><span>${esc(o.label)}</span></button>`).join('');document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{responses[at]=Number(el.dataset.choice);render()});$('prev').disabled=at===0;$('next').disabled=at===24;$('countDone').textContent=`${responses.filter(x=>x!==null).length} / 25`;$('progress').style.width=`${responses.filter(x=>x!==null).length*4}%`;$('submit').disabled=responses.some(x=>x===null);$('numbers').innerHTML=responses.map((v,i)=>`<button class="number ${v!==null?'done':''} ${at===i?'current':''}" data-q="${i}" aria-label="第${i+1}題${v!==null?'已作答':'未作答'}">${i+1}</button>`).join('');document.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{at=Number(el.dataset.q);render()})}
$('prev').onclick=()=>{if(at>0){at--;render()}};$('next').onclick=()=>{if(at<24){at++;render()}};$('start').onclick=start;$('retry').onclick=start;
function explanation(q){return `本題考查「${q.term}」的用法。正確選項為「${q.opts[q.correct].label}」，在此句中表示「${q.meaning}」。請留意前後文線索及詞性搭配。`}
function renderResults(){let correct=selected.filter((q,i)=>responses[i]===q.correct).length;$('total').textContent=`${correct*4} / 100`;$('resultStats').textContent=`答對 ${correct} 題｜答錯 ${25-correct} 題｜正確率 ${correct*4}%`;$('quiz').classList.add('hide');$('result').classList.remove('hide');renderReviews();window.scrollTo({top:0,behavior:'instant'})}
function renderReviews(){let list=selected.map((q,i)=>({q,i,ok:responses[i]===q.correct})).filter(x=>!wrongOnly||!x.ok);$('toggleWrong').textContent=wrongOnly?'顯示全部題目':'只看答錯題';$('reviewList').innerHTML=list.length?list.map(({q,i,ok})=>{let a=responses[i];let mine=`${letters[a]}. ${q.opts[a].label}`;let right=`${letters[q.correct]}. ${q.opts[q.correct].label}`;return `<article class="review ${ok?'ok':'bad'}"><div class="toprow"><strong>第 ${i+1} 題 <span style="color:${ok?'#16815b':'#b33f48'}">${ok?'✓ 答對':'✗ 答錯'}</span></strong><span class="small">${esc(q.date)} · ${esc(q.article)}</span></div><div class="question">${esc(q.stem)}</div><ul>${q.opts.map((o,j)=>`<li style="${j===q.correct?'font-weight:750;color:#157852':''}">${letters[j]}. ${esc(o.label)} ${j===q.correct?'✓':''}</li>`).join('')}</ul><div class="answerline">你的答案：${esc(mine)}<br><strong>正確答案：${esc(right)}</strong></div><div class="explain"><b>單字解析</b>｜${esc(q.term)} (${esc(q.pos)})：${esc(q.meaning)}<div style="margin-top:6px">${esc(explanation(q))}</div></div></article>`}).join(''):'<p>這回合全部答對！</p>'}
$('toggleWrong').onclick=()=>{wrongOnly=!wrongOnly;renderReviews()};$('submit').onclick=()=>{if(responses.some(x=>x===null)){$('unansweredNote').textContent='請先完成所有題目。';$('unansweredNote').classList.remove('hide');return}if(confirm('確認交卷？交卷後即顯示分數與解析，無法再修改答案。'))renderResults()};
</script></body></html>
